<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    a {
        text-decoration: none;
    }
    nav {
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    nav::before {
        position: absolute;
        content: "";
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        width: 100%;
        border: 1px solid black;
    }

    nav ul {
        position: relative;
        display: inline-flex;
    }

    nav ul li {
        list-style: none;
        margin: 5px;
    }

    nav ul li a {
        text-decoration: none;
        color: black;
    }

    .footer {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        bottom: 0;
    }
    .footer::before{
        position: absolute;
        content: "";
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        width: 100%;
        border: 1px solid black;
    }
    .Form-login{
        position: relative;
        display: flex;
        flex-direction: column; 
        align-items: center; 
    
        
    }
    .Form-login form .text-box {
        margin: 20px;
        width: 400px;
    }
    .Form-login form .text-box .submit{
        background: blue;
        color: white;
        padding: 10px 10px;
        border: none;
        border-radius: 5px;
    }
</style>

<body>
    <nav>
        <ul>
            <li><a href="">Home |</a></li>
            <li><a href="./login1.html">Đăng Nhập |</a></li>
            <li><a href="./register.html">Đăng Ký</a></li>
        </ul>
    </nav>
    <div class="Form-login">
        <div>
            <h2>Màn Hình Đăng Nhập</h2>
        </div>
        <form action="" method="post">
            <div class="text-box">
                <label for="name">Username</label>
                <input type="text" name="username" >
            </div>
            <div class="text-box">
                <label for="name">Mật Khẩu</label>
                <input type="text" name="password" ><br>
                <input type="checkbox" name="remember" ><label for="remember">Nho mat khau</label>
            </div>
            <div class="text-box">
                <label for="name"><a href="">Quen Mat Khau</a></label>
                <input class="submit" type="submit" value="Đăng nhập">
            </div>
            
        </form>
    </div>
    
    <div class="footer">
        <div class="footer-container">
            <p>LapTrinhWeb @1/2024</p>
        </div>
    </div>
        
</body>

</html>
